name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders — the build only needs the vars to exist;
          # no external calls are made during static generation of this app's
          # dynamic routes. Real values live in Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          # Throwaway media-proxy token secret; tokens are signed and verified
          # within the same run, so any non-empty value works in CI. The real
          # secret lives in Vercel.
          MEDIA_PROXY_SECRET: ci-media-proxy-secret-placeholder

  # Hardening guardrails — cheap pattern checks that encode the exact
  # regressions the pre-scale audit fixed (backslash .or() sanitizer, thrown
  # Response in a route, await cookies() outside the auth exceptions) plus a
  # high/critical dependency audit. See scripts/hardening-guardrails.sh and
  # docs/HARDENING.md. Fast; runs on every PR alongside `verify`.
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Hardening guardrails
        run: bash scripts/hardening-guardrails.sh

  # Playwright smoke suite against the real Supabase project (no staging
  # exists): global setup creates a disposable private-visibility edgeqa-*
  # user, teardown always deletes it, and a 24h sweep drains orphans from
  # killed runs. Skips green until the three secrets are configured in the
  # repo settings (job-level `if:` cannot read the secrets context, hence
  # the gate step).
  smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Guardian profiles launched to prod Aug 19 2026 — the smoke build must
      # match the prod build so guardian-console.spec.ts arms instead of
      # green-skipping on its flag probe.
      NEXT_PUBLIC_FEATURE_GUARDIAN_PROFILES: '1'
      # Media-proxy token secret — throwaway for CI (signed+verified in-run).
      MEDIA_PROXY_SECRET: ci-media-proxy-secret-placeholder
    steps:
      - name: Gate on secrets
        id: gate
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Supabase secrets not configured — skipping smoke suite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      # WebKit too (Sep 2026): the `webkit-mobile` project runs the @mobile
      # specs on the phone ENGINE — every iPhone browser is WebKit.
      - name: Install Playwright browsers
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install chromium webkit --with-deps

      - name: Run smoke suite
        if: steps.gate.outputs.run == 'true'
        run: npx playwright test

      - name: Upload report on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
