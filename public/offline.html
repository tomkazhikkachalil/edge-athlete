<title>You're offline · Edge Athlete</title>
<!--
  The ONE page the service worker keeps (maintenance pass, Oct 10 2026):
  precached at install, answered only when a navigation cannot reach the
  network. Static — no user data, no request of its own beyond a reload.
  Light and dark follow the device. In-progress recordings, workouts, scores
  and drafts stay on the phone and send when the connection returns.
-->
<style>
  :root { --bg:#f7f6fb; --card:#ffffff; --fg:#17151f; --muted:#5d5873; --line:#e3e0ef; --brand:#7c3aed; --brand-fg:#ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14121b; --card:#1d1a27; --fg:#ece9f5; --muted:#a59fbd; --line:#2e2a3d; --brand:#8b5cf6; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px 16px; padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06); }
  img { width: 56px; height: 56px; border-radius: 14px; display: block; margin: 0 auto 16px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); }
  button { appearance: none; border: 0; border-radius: 999px; background: var(--brand); color: var(--brand-fg); font: 600 16px/1 inherit; font-family: inherit; min-height: 44px; padding: 0 24px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .note { margin: 16px 0 0; font-size: 14px; }
</style>
</head>

  <h1>You're offline</h1>
  <p>Edge Athlete can't reach the internet right now. Anything you were recording or writing is saved on this device and will send when you're back online.</p>
  <button type="button" id="retry">Try again</button>
  <p class="note" role="status" aria-live="polite" id="status"></p>

<script>
  (function () {
    var retry = document.getElementById('retry');
    var status = document.getElementById('status');
    function go() { status.textContent = 'Reconnecting…'; location.reload(); }
    retry.addEventListener('click', go);
    window.addEventListener('online', go);
  })();
</script>
